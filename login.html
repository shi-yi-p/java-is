<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Melody · 登录</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  body {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #ff9ec7 0%, #ff6fb5 45%, #c44fa0 100%);
    overflow: hidden; position: relative;
  }
  .blob { position: absolute; border-radius: 50%; filter: blur(60px); opacity: .55; animation: float 9s ease-in-out infinite; }
  .blob.b1 { width: 320px; height: 320px; background: #ffd1e8; top: -80px; left: -60px; }
  .blob.b2 { width: 260px; height: 260px; background: #ff7bc0; bottom: -70px; right: -50px; animation-delay: -3s; }
  .blob.b3 { width: 200px; height: 200px; background: #fff0a8; top: 40%; right: 15%; opacity: .35; animation-delay: -6s; }
  @keyframes float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-26px) } }

  .card {
    position: relative; z-index: 1; width: 370px; padding: 34px 32px 28px;
    background: rgba(255,255,255,.93); backdrop-filter: blur(12px);
    border-radius: 28px; box-shadow: 0 24px 60px rgba(150,20,90,.30);
    animation: pop .5s cubic-bezier(.2,.8,.3,1.2) both;
  }
  @keyframes pop { from { opacity: 0; transform: translateY(24px) scale(.96) } to { opacity: 1; transform: none } }

  .brand { text-align: center; margin-bottom: 22px; }
  .logo {
    width: 62px; height: 62px; margin: 0 auto 10px; border-radius: 20px;
    background: linear-gradient(135deg, #ff8fc7, #ff5fa8);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 10px 22px rgba(255,95,168,.45); animation: pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { box-shadow: 0 10px 22px rgba(255,95,168,.45) } 50% { box-shadow: 0 10px 30px rgba(255,95,168,.75) } }
  .logo svg { width: 32px; height: 32px; fill: #fff; }
  .brand h1 { font-size: 23px; color: #c93c86; letter-spacing: 1px; }
  .brand p { font-size: 13px; color: #b07; opacity: .7; margin-top: 3px; }

  .tabs { display: flex; background: #ffe6f2; border-radius: 12px; padding: 4px; margin-bottom: 20px; }
  .tab { flex: 1; text-align: center; padding: 9px 0; font-size: 14px; color: #c96aa0; border-radius: 9px; cursor: pointer; transition: .25s; }
  .tab.active { background: #fff; color: #ff5fa8; font-weight: 600; box-shadow: 0 4px 10px rgba(255,95,168,.20); }

  .panel { display: none; animation: fade .3s ease; }
  .panel.active { display: block; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px) } to { opacity: 1; transform: none } }

  .field { position: relative; margin-bottom: 14px; }
  .field svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; fill: #d36aa0; }
  .field input {
    width: 100%; height: 48px; padding: 0 44px 0 42px; border: 1.5px solid #ffd0e6;
    border-radius: 14px; font-size: 15px; color: #7a2e57; background: #fff;
    outline: none; transition: .2s;
  }
  .field input:focus { border-color: #ff6fb5; box-shadow: 0 0 0 3px rgba(255,111,181,.18); }
  .field input::placeholder { color: #e3a6c8; }
  .toggle { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); cursor: pointer; font-size: 12px; color: #ff6fb5; user-select: none; }

  .code-btn {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    height: 36px; padding: 0 12px; border: none; border-radius: 10px; cursor: pointer;
    background: #ff5fa8; color: #fff; font-size: 12px; transition: .2s;
  }
  .code-btn:disabled { background: #f3b9d8; cursor: not-allowed; }

  .row { display: flex; align-items: center; justify-content: space-between; margin: 2px 2px 18px; font-size: 13px; }
  .agree { display: flex; align-items: center; gap: 6px; color: #a85585; cursor: pointer; }
  .agree input { accent-color: #ff5fa8; width: 15px; height: 15px; }
  .agree a { color: #ff5fa8; text-decoration: none; }
  .forgot { color: #ff5fa8; text-decoration: none; }

  .btn {
    position: relative; overflow: hidden; width: 100%; height: 50px; border: none; border-radius: 15px;
    cursor: pointer; font-size: 16px; font-weight: 600; color: #fff;
    background: linear-gradient(135deg, #ff8fc7, #ff4f9e);
    box-shadow: 0 12px 24px rgba(255,79,158,.40); transition: .2s;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 16px 30px rgba(255,79,158,.50); }
  .btn:disabled { opacity: .7; cursor: not-allowed; transform: none; }
  .ripple { position: absolute; border-radius: 50%; background: rgba(255,255,255,.55); transform: scale(0); animation: rip .6s ease-out; pointer-events: none; }
  @keyframes rip { to { transform: scale(2.6); opacity: 0 } }
  .spinner { width: 18px; height: 18px; border: 2.5px solid rgba(255,255,255,.4); border-top-color: #fff; border-radius: 50%; display: inline-block; vertical-align: middle; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg) } }

  .divider { display: flex; align-items: center; gap: 12px; margin: 20px 0 14px; color: #d98bb6; font-size: 12px; }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: #ffd9ec; }

  .socials { display: flex; justify-content: center; gap: 16px; }
  .social {
    width: 48px; height: 48px; border-radius: 14px; border: 1.5px solid #ffd9ec;
    background: #fff; display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: .2s; position: relative;
  }
  .social:hover { transform: translateY(-3px); border-color: #ff6fb5; box-shadow: 0 8px 16px rgba(255,95,168,.25); }
  .social:active { transform: scale(.92); }
  .social svg { width: 24px; height: 24px; }
  .social .tip {
    position: absolute; bottom: -26px; left: 50%; transform: translateX(-50%);
    font-size: 11px; color: #ff5fa8; white-space: nowrap; opacity: 0; transition: .2s;
  }
  .social:hover .tip { opacity: 1; }

  .signup { text-align: center; margin-top: 18px; font-size: 13px; color: #a85585; }
  .signup a { color: #ff5fa8; text-decoration: none; font-weight: 600; }

  .toast {
    position: fixed; left: 50%; bottom: 40px; transform: translate(-50%, 20px);
    background: rgba(60,10,40,.92); color: #fff; padding: 12px 22px; border-radius: 12px;
    font-size: 14px; opacity: 0; transition: .3s; z-index: 99; pointer-events: none;
    box-shadow: 0 10px 30px rgba(0,0,0,.3);
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>

  <div class="card">
    <div class="brand">
      <div class="logo"><svg viewBox="0 0 24 24"><path d="M12 3v10.55A4 4 0 1014 17V7h4V3h-6z"/></svg></div>
      <h1>Melody</h1>
      <p>让每个瞬间都有旋律</p>
    </div>

    <div class="tabs">
      <div class="tab active" data-tab="pw">密码登录</div>
      <div class="tab" data-tab="code">验证码登录</div>
    </div>

    <!-- 密码登录 -->
    <form class="panel active" id="pwForm" autocomplete="off">
      <div class="field">
        <svg viewBox="0 0 24 24"><path d="M20 4H4a2 2 0 00-2 2v12a2 2 0 002 2h16a2 2 0 002-2V6a2 2 0 00-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
        <input id="pwAccount" type="text" placeholder="手机号 / 邮箱" required>
      </div>
      <div class="field">
        <svg viewBox="0 0 24 24"><path d="M12 1a5 5 0 00-5 5v3H6a2 2 0 00-2 2v9a2 2 0 002 2h12a2 2 0 002-2v-9a2 2 0 00-2-2h-1V6a5 5 0 00-5-5zm3 8H9V6a3 3 0 016 0v3z"/></svg>
        <input id="pwPassword" type="password" placeholder="密码" required>
        <span class="toggle" data-target="pwPassword">显示</span>
      </div>
      <div class="row">
        <label class="agree"><input type="checkbox" id="pwAgree"> 我已阅读并同意<a href="javascript:void(0)">用户协议</a></label>
        <a class="forgot" href="javascript:void(0)">忘记密码？</a>
      </div>
      <button class="btn" id="pwSubmit" disabled>登 录</button>
    </form>

    <!-- 验证码登录 -->
    <form class="panel" id="codeForm" autocomplete="off">
      <div class="field">
        <svg viewBox="0 0 24 24"><path d="M6.6 10.8a15 15 0 006.6 6.6l2.2-2.2a1 1 0 011-.24c1.1.37 2.3.57 3.6.57a1 1 0 011 1V20a1 1 0 01-1 1A17 17 0 013 4a1 1 0 011-1h3.6a1 1 0 011 1c0 1.3.2 2.5.57 3.6a1 1 0 01-.24 1l-2.33 2.2z"/></svg>
        <input id="codePhone" type="tel" placeholder="手机号" maxlength="11" required>
      </div>
      <div class="field">
        <svg viewBox="0 0 24 24"><path d="M12 1a5 5 0 00-5 5v3H6a2 2 0 00-2 2v9a2 2 0 002 2h12a2 2 0 002-2v-9a2 2 0 00-2-2h-1V6a5 5 0 00-5-5zm3 8H9V6a3 3 0 016 0v3z"/></svg>
        <input id="codeInput" type="text" placeholder="短信验证码" maxlength="6" style="padding-right:96px">
        <button type="button" class="code-btn" id="getCode">获取验证码</button>
      </div>
      <div class="row">
        <label class="agree"><input type="checkbox" id="codeAgree"> 我已阅读并同意<a href="javascript:void(0)">用户协议</a></label>
      </div>
      <button class="btn" id="codeSubmit" disabled>登 录</button>
    </form>

    <div class="divider">其他方式登录</div>
    <div class="socials">
      <div class="social" data-name="微信" title="微信">
        <svg viewBox="0 0 24 24" fill="#1aad19"><path d="M8.7 3C4.5 3 1 5.9 1 9.4c0 2 1.2 3.8 3 5l-.7 2.2 2.5-1.3c.9.2 1.8.4 2.9.4h.6a5.7 5.7 0 01-.3-1.9c0-3.3 3.1-5.9 6.9-5.9h.6C16.5 5.2 13 3 8.7 3zM6 7.5a1.1 1.1 0 110 2.2 1.1 1.1 0 010-2.2zm5.4 0a1.1 1.1 0 110 2.2 1.1 1.1 0 010-2.2zM22 13.6c0-2.8-2.8-5.1-6.2-5.1s-6.2 2.3-6.2 5.1 2.8 5.1 6.2 5.1c.7 0 1.4-.1 2-.3l1.9 1-.5-1.7c1.6-.9 2.8-2.4 2.8-4.1zm-8.2-.9a.9.9 0 110 1.7.9.9 0 010-1.7zm4 0a.9.9 0 110 1.7.9.9 0 010-1.7z"/></svg>
        <span class="tip">微信登录</span>
      </div>
      <div class="social" data-name="Apple" title="Apple">
        <svg viewBox="0 0 24 24" fill="#222"><path d="M16.4 12.7c0-2 1.6-3 1.7-3-1-1.4-2.4-1.6-2.9-1.6-1.2-.1-2.4.7-3 .7-.6 0-1.6-.7-2.6-.7-1.3 0-2.6.8-3.3 2-1.4 2.4-.4 6 1 8 .7 1 1.4 2 2.4 2 1 0 1.3-.6 2.5-.6 1.1 0 1.5.6 2.5.6 1 0 1.7-1 2.3-2 .7-1 1-2 1-2.1-.1 0-2-.8-2-3zM14.5 6.3c.5-.7.9-1.6.8-2.6-.8 0-1.8.5-2.4 1.2-.5.6-1 1.5-.8 2.4.9.1 1.8-.4 2.4-1z"/></svg>
        <span class="tip">Apple 登录</span>
      </div>
      <div class="social" data-name="Google" title="Google">
        <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
        <span class="tip">Google 登录</span>
      </div>
    </div>

    <div class="signup">还没有账号？<a href="javascript:void(0)" id="goRegister">立即注册</a></div>
  </div>

  <div class="toast" id="toast"></div>

<script>
  const $ = (s) => document.querySelector(s);
  function toast(msg) {
    const t = $('#toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 2200);
  }

  // 标签切换
  document.querySelectorAll('.tab').forEach(tab => {
    tab.onclick = () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      tab.classList.add('active');
      $('#' + (tab.dataset.tab === 'pw' ? 'pwForm' : 'codeForm')).classList.add('active');
    };
  });

  // 密码显隐
  document.querySelectorAll('.toggle').forEach(t => {
    t.onclick = () => {
      const el = $('#' + t.dataset.target);
      const show = el.type === 'password';
      el.type = show ? 'text' : 'password';
      t.textContent = show ? '隐藏' : '显示';
    };
  });

  // 协议勾选控制按钮
  const pwAgree = $('#pwAgree'), codeAgree = $('#codeAgree');
  pwAgree.onchange = () => $('#pwSubmit').disabled = !pwAgree.checked;
  codeAgree.onchange = () => $('#codeSubmit').disabled = !codeAgree.checked;

  // 涟漪 + 加载态
  function bindSubmit(btn, msg) {
    btn.onclick = (e) => {
      const r = document.createElement('span');
      const d = Math.max(btn.clientWidth, btn.clientHeight);
      r.className = 'ripple';
      r.style.width = r.style.height = d + 'px';
      r.style.left = (e.clientX - btn.getBoundingClientRect().left - d/2) + 'px';
      r.style.top = (e.clientY - btn.getBoundingClientRect().top - d/2) + 'px';
      btn.appendChild(r);
      setTimeout(() => r.remove(), 600);
      btn.disabled = true;
      const html = btn.innerHTML;
      btn.innerHTML = '<span class="spinner"></span>';
      setTimeout(() => { btn.innerHTML = html; btn.disabled = !$('#' + (btn.id==='pwSubmit'?'pwAgree':'codeAgree')).checked; toast(msg); }, 1200);
    };
  }
  bindSubmit($('#pwSubmit'), '密码登录成功（演示）');
  bindSubmit($('#codeSubmit'), '验证码登录成功（演示）');

  // 获取验证码倒计时
  const getCode = $('#getCode');
  getCode.onclick = () => {
    const phone = $('#codePhone').value.trim();
    if (!/^1\d{10}$/.test(phone)) { toast('请输入正确的手机号'); return; }
    let n = 60; getCode.disabled = true; getCode.textContent = n + 's';
    toast('验证码已发送（演示：123456）');
    const t = setInterval(() => {
      n--; getCode.textContent = n + 's';
      if (n <= 0) { clearInterval(t); getCode.disabled = false; getCode.textContent = '获取验证码'; }
    }, 1000);
  };

  // 第三方登录
  document.querySelectorAll('.social').forEach(s => {
    s.onclick = () => {
      s.animate([{ transform: 'scale(1)' }, { transform: 'scale(.85)' }, { transform: 'scale(1)' }], { duration: 300 });
      toast('正在跳转到' + s.dataset.name + '登录…（演示）');
    };
  });

  // 注册 / 忘记密码
  $('#goRegister').onclick = () => toast('注册功能演示，敬请期待');
  document.querySelector('.forgot').onclick = () => toast('可通过手机号重置密码（演示）');

  // 表单提交拦截
  $('#pwForm').onsubmit = e => e.preventDefault();
  $('#codeForm').onsubmit = e => e.preventDefault();
</script>
</body>
</html>
