<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Melody · 登录</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  body {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #ff9ec7 0%, #ff6fb5 45%, #c44fa0 100%);
    overflow: hidden; position: relative;
  }
  .blob { position: absolute; border-radius: 50%; filter: blur(60px); opacity: .55; }
  .blob.b1 { width: 320px; height: 320px; background: #ffd1e8; top: -80px; left: -60px; }
  .blob.b2 { width: 260px; height: 260px; background: #ff7bc0; bottom: -70px; right: -50px; }
  .blob.b3 { width: 200px; height: 200px; background: #fff0a8; top: 40%; right: 15%; opacity: .35; }

  .card {
    position: relative; z-index: 1; width: 360px; padding: 38px 32px 30px;
    background: rgba(255,255,255,.92); backdrop-filter: blur(12px);
    border-radius: 28px; box-shadow: 0 24px 60px rgba(150,20,90,.30);
  }
  .brand { text-align: center; margin-bottom: 26px; }
  .logo {
    width: 64px; height: 64px; margin: 0 auto 12px; border-radius: 20px;
    background: linear-gradient(135deg, #ff8fc7, #ff5fa8);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 10px 22px rgba(255,95,168,.45);
  }
  .logo svg { width: 34px; height: 34px; fill: #fff; }
  .brand h1 { font-size: 24px; color: #c93c86; letter-spacing: 1px; }
  .brand p { font-size: 13px; color: #b07; opacity: .7; margin-top: 4px; }

  .field { position: relative; margin-bottom: 16px; }
  .field svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; fill: #d36aa0; }
  .field input {
    width: 100%; height: 48px; padding: 0 44px 0 42px; border: 1.5px solid #ffd0e6;
    border-radius: 14px; font-size: 15px; color: #7a2e57; background: #fff;
    outline: none; transition: .2s;
  }
  .field input:focus { border-color: #ff6fb5; box-shadow: 0 0 0 3px rgba(255,111,181,.18); }
  .field input::placeholder { color: #e3a6c8; }
  .toggle {
    position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    cursor: pointer; font-size: 12px; color: #ff6fb5; user-select: none;
  }

  .row { display: flex; align-items: center; justify-content: space-between; margin: 4px 2px 18px; font-size: 13px; }
  .agree { display: flex; align-items: center; gap: 6px; color: #a85585; cursor: pointer; }
  .agree input { accent-color: #ff5fa8; width: 15px; height: 15px; }
  .agree a { color: #ff5fa8; text-decoration: none; }
  .forgot { color: #ff5fa8; text-decoration: none; }

  .btn {
    width: 100%; height: 50px; border: none; border-radius: 15px; cursor: pointer;
    font-size: 16px; font-weight: 600; color: #fff;
    background: linear-gradient(135deg, #ff8fc7, #ff4f9e);
    box-shadow: 0 12px 24px rgba(255,79,158,.40); transition: .2s;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 16px 30px rgba(255,79,158,.50); }
  .btn:disabled { opacity: .5; cursor: not-allowed; transform: none; box-shadow: none; }

  .divider { display: flex; align-items: center; gap: 12px; margin: 22px 0 16px; color: #d98bb6; font-size: 12px; }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: #ffd9ec; }

  .socials { display: flex; justify-content: center; gap: 18px; }
  .social {
    width: 48px; height: 48px; border-radius: 14px; border: 1.5px solid #ffd9ec;
    background: #fff; display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: .2s;
  }
  .social:hover { transform: translateY(-2px); border-color: #ff6fb5; }
  .social svg { width: 24px; height: 24px; }

  .signup { text-align: center; margin-top: 20px; font-size: 13px; color: #a85585; }
  .signup a { color: #ff5fa8; text-decoration: none; font-weight: 600; }
</style>
</head>
<body>
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>

  <div class="card">
    <div class="brand">
      <div class="logo">
        <svg viewBox="0 0 24 24"><path d="M12 3v10.55A4 4 0 1014 17V7h4V3h-6z"/></svg>
      </div>
      <h1>Melody</h1>
      <p>让每个瞬间都有旋律</p>
    </div>

    <form id="loginForm" autocomplete="off">
      <div class="field">
        <svg viewBox="0 0 24 24"><path d="M20 4H4a2 2 0 00-2 2v12a2 2 0 002 2h16a2 2 0 002-2V6a2 2 0 00-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
        <input id="account" type="text" placeholder="手机号 / 邮箱" required>
      </div>
      <div class="field">
        <svg viewBox="0 0 24 24"><path d="M12 1a5 5 0 00-5 5v3H6a2 2 0 00-2 2v9a2 2 0 002 2h12a2 2 0 002-2v-9a2 2 0 00-2-2h-1V6a5 5 0 00-5-5zm3 8H9V6a3 3 0 016 0v3zm-3 4a1.5 1.5 0 011.5 1.5V17a1.5 1.5 0 01-3 0v-1.5A1.5 1.5 0 0112 13z"/></svg>
        <input id="password" type="password" placeholder="密码" required>
        <span class="toggle" id="togglePw">显示</span>
      </div>

      <div class="row">
        <label class="agree"><input type="checkbox" id="agree"> 我已阅读并同意<a href="#">用户协议</a></label>
        <a class="forgot" href="#">忘记密码？</a>
      </div>

      <button class="btn" id="submitBtn" disabled>登 录</button>
    </form>

    <div class="divider">其他方式登录</div>
    <div class="socials">
      <div class="social" title="微信">
        <svg viewBox="0 0 24 24" fill="#1aad19"><path d="M8.7 3C4.5 3 1 5.9 1 9.4c0 2 1.2 3.8 3 5l-.7 2.2 2.5-1.3c.9.2 1.8.4 2.9.4h.6a5.7 5.7 0 01-.3-1.9c0-3.3 3.1-5.9 6.9-5.9h.6C16.5 5.2 13 3 8.7 3zM6 7.5a1.1 1.1 0 110 2.2 1.1 1.1 0 010-2.2zm5.4 0a1.1 1.1 0 110 2.2 1.1 1.1 0 010-2.2zM22 13.6c0-2.8-2.8-5.1-6.2-5.1s-6.2 2.3-6.2 5.1 2.8 5.1 6.2 5.1c.7 0 1.4-.1 2-.3l1.9 1-.5-1.7c1.6-.9 2.8-2.4 2.8-4.1zm-8.2-.9a.9.9 0 110 1.7.9.9 0 010-1.7zm4 0a.9.9 0 110 1.7.9.9 0 010-1.7z"/></svg>
      </div>
      <div class="social" title="Apple">
        <svg viewBox="0 0 24 24" fill="#222"><path d="M16.4 12.7c0-2 1.6-3 1.7-3-1-1.4-2.4-1.6-2.9-1.6-1.2-.1-2.4.7-3 .7-.6 0-1.6-.7-2.6-.7-1.3 0-2.6.8-3.3 2-1.4 2.4-.4 6 1 8 .7 1 1.4 2 2.4 2 1 0 1.3-.6 2.5-.6 1.1 0 1.5.6 2.5.6 1 0 1.7-1 2.3-2 .7-1 1-2 1-2.1-.1 0-2-.8-2-3zM14.5 6.3c.5-.7.9-1.6.8-2.6-.8 0-1.8.5-2.4 1.2-.5.6-1 1.5-.8 2.4.9.1 1.8-.4 2.4-1z"/></svg>
      </div>
      <div class="social" title="Google">
        <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      </div>
    </div>

    <div class="signup">还没有账号？<a href="#">立即注册</a></div>
  </div>

<script>
  const pw = document.getElementById('password');
  const togglePw = document.getElementById('togglePw');
  const agree = document.getElementById('agree');
  const submitBtn = document.getElementById('submitBtn');
  const form = document.getElementById('loginForm');

  togglePw.onclick = () => {
    const show = pw.type === 'password';
    pw.type = show ? 'text' : 'password';
    togglePw.textContent = show ? '隐藏' : '显示';
  };
  agree.onchange = () => { submitBtn.disabled = !agree.checked; };
  form.onsubmit = (e) => {
    e.preventDefault();
    alert('演示登录：' + document.getElementById('account').value);
  };
</script>
</body>
</html>
