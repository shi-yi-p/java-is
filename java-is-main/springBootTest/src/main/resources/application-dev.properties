# ========== 服务器端口（与前端 shayu 约定一致：8081） ==========
server.port=8081

# ========== 后台管理系统管理员账号（仅登录用，不进 user 表） ==========
shark.admin.account=admin
shark.admin.password=admin123

# ========== 数据源：MySQL ==========
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/shark_music?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=123456

# ========== MyBatis-Plus 配置 ==========
# 主键策略：数据库自增
mybatis-plus.global-config.db-config.id-type=auto
# 逻辑删除字段（0-未删 1-已删）
mybatis-plus.global-config.db-config.logic-delete-field=deleted
mybatis-plus.global-config.db-config.logic-delete-value=1
mybatis-plus.global-config.db-config.logic-not-delete-value=0
# 插入/更新时空值字段不写入 SQL，交由数据库默认值生效（create_time / update_time / deleted）
mybatis-plus.global-config.db-config.insert-strategy=not_null
mybatis-plus.global-config.db-config.update-strategy=not_null
# 下划线转驼峰
mybatis-plus.configuration.map-underscore-to-camel-case=true
